<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Drift Rush</title>
  <style>
    :root {
      --bg1: #071018;
      --bg2: #112834;
      --cyan: #6fe7ff;
      --pink: #ff5ec7;
      --yellow: #ffd166;
      --green: #8ef7a1;
      --white: #ebf5ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, rgba(111,231,255,0.12), transparent 30%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
    }

    body {
      display: grid;
      place-items: center;
    }

    #gameWrap {
      position: relative;
      width: min(96vw, 1200px);
      height: min(88vh, 720px);
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 40px rgba(111, 231, 255, 0.12), 0 0 90px rgba(255, 94, 199, 0.08);
      background: #091a22;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #081825 0%, #0d2435 28%, #091d25 100%);
    }

    .hud {
      position: absolute;
      inset: 16px 16px auto 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    .panel {
      min-width: 140px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(7, 17, 26, 0.72);
      border: 1px solid rgba(150, 220, 255, 0.22);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .label {
      opacity: 0.8;
      font-size: 11px;
    }

    .drift-box {
      position: absolute;
      left: 18px;
      bottom: 18px;
      width: min(340px, 38vw);
      padding: 12px 14px 10px;
      border-radius: 18px;
      background: rgba(8, 17, 26, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .meter-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
    }

    .meter-track {
      position: relative;
      height: 16px;
      border-radius: 999px;
      background: rgba(143, 166, 190, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .meter-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--pink));
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.5);
      border-radius: inherit;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(7, 15, 24, 0.66);
      border: 1px solid rgba(111, 231, 255, 0.18);
      z-index: 10;
      white-space: nowrap;
    }

    .touch-controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      z-index: 10;
    }

    .touch-btn {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(8, 17, 26, 0.7);
      color: var(--white);
      font-size: 26px;
      font-weight: 700;
      touch-action: manipulation;
    }

    @media (max-width: 720px) {
      .panel { min-width: 100px; padding: 8px 10px; }
      .label { font-size: 9px; }
      .touch-controls { right: 12px; bottom: 12px; }
      .touch-btn { width: 52px; height: 52px; }
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <div class="hud">
      <div class="panel"><span class="label">Score</span><span id="scoreValue">0</span></div>
      <div class="panel"><span class="label">Lap</span><span id="lapValue">1 / 3</span></div>
      <div class="panel"><span class="label">Time</span><span id="timeValue">00:00.0</span></div>
    </div>

    <div class="drift-box">
      <div class="meter-header"><span>Drift</span><span id="driftPercent">0%</span></div>
      <div class="meter-track"><div id="meterFill" class="meter-fill"></div></div>
    </div>

    <div class="message" id="messageBox">Slide through the gates!</div>

    <div class="touch-controls">
      <button class="touch-btn" data-key="ArrowLeft">◀</button>
      <button class="touch-btn" data-key="ArrowUp">▲</button>
      <button class="touch-btn" data-key="ArrowRight">▶</button>
      <button class="touch-btn" data-key="ArrowDown">▼</button>
    </div>

    <canvas id="gameCanvas" width="1200" height="720"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreValue = document.getElementById('scoreValue');
    const lapValue = document.getElementById('lapValue');
    const timeValue = document.getElementById('timeValue');
    const driftPercent = document.getElementById('driftPercent');
    const meterFill = document.getElementById('meterFill');
    const messageBox = document.getElementById('messageBox');
    const keys = {};
    const touchButtons = document.querySelectorAll('.touch-btn');

    const state = {
      score: 0,
      laps: 1,
      lapsGoal: 3,
      elapsed: 0,
      driftMeter: 0,
      driftGoal: 100,
      checkpointIndex: 0,
      combo: 1,
      lastTime: 0,
      messageTimer: 0,
      health: 100,
      boostTimer: 0
    };

    const player = {
      x: 220, y: 170,
      vx: 0, vy: 0,
      angle: -Math.PI / 2,
      speed: 0,
      radius: 16,
      trail: [],
      invuln: 0,
      health: 100
    };

    const boostPads = [
      { x: 440, y: 260, r: 22, active: true },
      { x: 760, y: 430, r: 22, active: true },
      { x: 250, y: 480, r: 22, active: true }
    ];

    const course = {
      outer: [
        { x: 180, y: 130 }, { x: 440, y: 80 }, { x: 900, y: 180 }, { x: 1040, y: 420 },
        { x: 840, y: 610 }, { x: 430, y: 620 }, { x: 160, y: 520 }, { x: 90, y: 290 }
      ],
      checkpoints: [
        { x: 212, y: 122, r: 58, color: '#6fe7ff' },
        { x: 530, y: 115, r: 60, color: '#ff5ec7' },
        { x: 910, y: 236, r: 72, color: '#ffd166' },
        { x: 1014, y: 466, r: 68, color: '#8ef7a1' },
        { x: 714, y: 600, r: 78, color: '#6fe7ff' },
        { x: 280, y: 560, r: 68, color: '#ff5ec7' },
        { x: 138, y: 374, r: 60, color: '#ffd166' }
      ]
    };

    const aiCars = [
      { x: 330, y: 160, vx: 0, vy: 0, angle: 0, speed: 90, color: '#ff5ec7', radius: 18 },
      { x: 620, y: 160, vx: 0, vy: 0, angle: 0, speed: 110, color: '#6fe7ff', radius: 18 },
      { x: 860, y: 250, vx: 0, vy: 0, angle: 0, speed: 100, color: '#ffd166', radius: 18 },
      { x: 980, y: 430, vx: 0, vy: 0, angle: 0, speed: 125, color: '#8ef7a1', radius: 18 }
    ];

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function formatTime(ms) {
      const totalSeconds = ms / 1000;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.floor(totalSeconds % 60);
      const tenths = Math.floor((totalSeconds % 1) * 10);
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
    }
    function setMessage(text, duration = 1200) {
      messageBox.textContent = text;
      state.messageTimer = duration;
    }
    function circleHit(px, py, cx, cy, radius) {
      return Math.hypot(px - cx, py - cy) <= radius + player.radius + 8;
    }
    function bindTouch() {
      touchButtons.forEach((btn) => {
        const key = btn.dataset.key;
        const down = (e) => {
          e.preventDefault();
          keys[key.toLowerCase()] = true;
          keys[key] = true;
          btn.style.transform = 'scale(0.96)';
          btn.style.background = 'rgba(111, 231, 255, 0.15)';
        };
        const up = () => {
          keys[key.toLowerCase()] = false;
          keys[key] = false;
          btn.style.transform = 'scale(1)';
          btn.style.background = 'rgba(8, 17, 26, 0.7)';
        };
        btn.addEventListener('pointerdown', down);
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointerleave', up);
        btn.addEventListener('pointercancel', up);
      });
    }
    function onKeyChange(event, value) {
      const key = event.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
        event.preventDefault();
      }
      keys[key] = value;
      keys[event.key] = value;
    }
    function updateUI() {
      scoreValue.textContent = Math.floor(state.score);
      lapValue.textContent = `${state.laps} / ${state.lapsGoal}`;
      timeValue.textContent = formatTime(state.elapsed);
      driftPercent.textContent = `${Math.floor((state.driftMeter / state.driftGoal) * 100)}%`;
      meterFill.style.width = `${(state.driftMeter / state.driftGoal) * 100}%`;
    }
    function checkBoostPads() {
      boostPads.forEach((pad) => {
        if (!pad.active) return;
        if (Math.hypot(player.x - pad.x, player.y - pad.y) < pad.r + player.radius + 10) {
          pad.active = false;
          state.boostTimer = 1.5;
          player.speed = clamp(player.speed + 110, 0, 360);
          setMessage('Boost!', 600);
          setTimeout(() => pad.active = true, 1800);
        }
      });
    }
    function handleDamage(amount) {
      if (player.invuln > 0) return;
      player.health = Math.max(0, player.health - amount);
      player.invuln = 0.8;
      state.health = player.health;
      state.score = Math.max(0, state.score - 80);
      setMessage(`Damage! ${Math.ceil(player.health)} HP`, 700);
      if (player.health <= 0) {
        setMessage('Race over!', 1500);
        state.score = 0;
        resetRace();
      }
    }
    function resetRace() {
      state.score = 0;
      state.laps = 1;
      state.elapsed = 0;
      state.driftMeter = 0;
      state.checkpointIndex = 0;
      state.combo = 1;
      state.health = 100;
      player.health = 100;
      player.x = 220;
      player.y = 170;
      player.vx = 0;
      player.vy = 0;
      player.angle = -Math.PI / 2;
      player.speed = 0;
      player.trail = [];
      player.invuln = 0;
      aiCars.forEach((car, idx) => {
        car.x = [330, 620, 860, 980][idx] + Math.random() * 16;
        car.y = [160, 160, 250, 430][idx] + Math.random() * 16;
      });
    }
    function checkCheckpoints() {
      const cp = course.checkpoints[state.checkpointIndex];
      if (!cp) return;
      if (circleHit(player.x, player.y, cp.x, cp.y, cp.r)) {
        const driftBonus = Math.floor(state.driftMeter * 1.5);
        state.score += 180 + driftBonus + state.combo * 25;
        state.combo = Math.min(12, state.combo + 1);
        state.driftMeter = 0;
        state.checkpointIndex = (state.checkpointIndex + 1) % course.checkpoints.length;

        if (state.checkpointIndex === 0) {
          state.laps += 1;
          state.score += 600;
          if (state.laps > state.lapsGoal) {
            setMessage('Victory! You win!', 2200);
            state.laps = state.lapsGoal;
            return;
          }
          setMessage(`Lap ${state.laps} clear! +600`, 1400);
        } else {
          setMessage(`Gate ${state.checkpointIndex + 1}! +${180 + driftBonus}`, 900);
        }
      }
    }
    function updateAI(dt) {
      aiCars.forEach((car) => {
        car.angle += (Math.random() - 0.5) * 0.05;
        car.vx += Math.cos(car.angle) * car.speed * dt * 0.85;
        car.vy += Math.sin(car.angle) * car.speed * dt * 0.85;
        car.vx *= 0.96;
        car.vy *= 0.96;
        car.x += car.vx * dt * 60;
        car.y += car.vy * dt * 60;

        if (car.x < 40 || car.x > canvas.width - 40) car.vx *= -0.8;
        if (car.y < 40 || car.y > canvas.height - 40) car.vy *= -0.8;

        const dx = player.x - car.x;
        const dy = player.y - car.y;
        const dist = Math.hypot(dx, dy);
        if (dist < car.radius + player.radius + 18) {
          const push = 1 - dist / (car.radius + player.radius + 18);
          player.vx -= (dx / (dist || 1)) * 18 * push;
          player.vy -= (dy / (dist || 1)) * 18 * push;
          handleDamage(18);
        }
      });
    }
    function updatePlayer(dt) {
      const turn = (keys.arrowleft || keys.a ? -1 : 0) + (keys.arrowright || keys.d ? 1 : 0);
      const throttle = (keys.arrowup || keys.w ? 1 : 0) - (keys.arrowdown || keys.s ? 1 : 0);

      let acceleration = 0;
      if (throttle !== 0) acceleration = throttle * 260;
      else player.speed *= 0.985;

      if (state.boostTimer > 0) {
        player.speed += 220 * dt;
        state.boostTimer = Math.max(0, state.boostTimer - dt);
      }

      player.speed += acceleration * dt;
      player.speed = clamp(player.speed, -120, 260);

      const steerStrength = clamp(Math.abs(player.speed) / 180, 0.15, 1.2);
      const turnRate = (1.35 + steerStrength) * dt * 1.8;

      if (turn !== 0) {
        const direction = player.speed >= 0 ? 1 : -1;
        player.angle += turn * turnRate * direction;
      }

      const fx = Math.cos(player.angle);
      const fy = Math.sin(player.angle);
      const sx = Math.cos(player.angle + Math.PI / 2);
      const sy = Math.sin(player.angle + Math.PI / 2);

      if (Math.abs(turn) > 0 && Math.abs(player.speed) > 16) {
        const driftForce = turn * Math.abs(player.speed) * 0.3;
        player.vx += sx * driftForce * dt * 50;
        player.vy += sy * driftForce * dt * 50;
        state.driftMeter += Math.abs(driftForce) * dt * 1.4;
      } else {
        state.driftMeter *= 0.97;
      }

      player.vx += fx * player.speed * dt * 0.9;
      player.vy += fy * player.speed * dt * 0.9;
      player.vx *= 0.985;
      player.vy *= 0.985;

      player.x += player.vx * dt * 60;
      player.y += player.vy * dt * 60;

      const margin = 18;
      player.x = clamp(player.x, margin, canvas.width - margin);
      player.y = clamp(player.y, margin, canvas.height - margin);

      if (Math.abs(player.speed) < 0.8) player.speed = 0;

      player.trail.push({ x: player.x, y: player.y, life: 1 });
      if (player.trail.length > 26) player.trail.shift();
      for (const p of player.trail) p.life -= 0.03 * dt * 60;
      while (player.trail.length && player.trail[0].life <= 0) player.trail.shift();

      if (player.invuln > 0) player.invuln -= dt;
    }

    function update(dt) {
      updatePlayer(dt);
      updateAI(dt);
      checkBoostPads();
      checkCheckpoints();
      if (state.driftMeter > state.driftGoal) state.driftMeter = state.driftGoal;
      state.elapsed += dt * 1000;
      state.score += state.driftMeter * dt * 0.4;
      if (state.messageTimer > 0) state.messageTimer -= dt * 1000;
      updateUI();
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#081826');
      g.addColorStop(0.5, '#112d3b');
      g.addColorStop(1, '#091d25');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 9; i++) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(111,231,255,${0.08 + i * 0.025})`;
        ctx.lineWidth = 1 + i * 0.8;
        ctx.ellipse(canvas.width / 2, canvas.height / 2, 200 + i * 72, 220 + i * 62, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawTrack() {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(course.outer[0].x, course.outer[0].y);
      for (let i = 1; i < course.outer.length; i++) {
        const curr = course.outer[i];
        const prev = course.outer[i - 1];
        const midX = (prev.x + curr.x) / 2;
        const midY = (prev.y + curr.y) / 2;
        ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
      }
      const last = course.outer[course.outer.length - 1];
      const first = course.outer[0];
      ctx.quadraticCurveTo(last.x, last.y, first.x, first.y);

      ctx.lineWidth = 58;
      ctx.strokeStyle = 'rgba(17,30,47,0.86)';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(course.outer[0].x, course.outer[0].y);
      for (let i = 1; i < course.outer.length; i++) {
        const curr = course.outer[i];
        const prev = course.outer[i - 1];
        const midX = (prev.x + curr.x) / 2;
        const midY = (prev.y + curr.y) / 2;
        ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
      }
      const last2 = course.outer[course.outer.length - 1];
      const first2 = course.outer[0];
      ctx.quadraticCurveTo(last2.x, last2.y, first2.x, first2.y);

      ctx.lineWidth = 30;
      ctx.strokeStyle = 'rgba(111,231,255,0.2)';
      ctx.setLineDash([18, 16]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawBoostPads() {
      boostPads.forEach((pad) => {
        ctx.beginPath();
        ctx.fillStyle = pad.active ? '#8ef7a1' : 'rgba(142,247,161,0.25)';
        ctx.shadowColor = '#8ef7a1';
        ctx.shadowBlur = pad.active ? 18 : 10;
        ctx.arc(pad.x, pad.y, pad.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    function drawCheckpoints() {
      course.checkpoints.forEach((cp, index) => {
        const active = index === state.checkpointIndex;
        const glow = active ? 24 : 14;

        ctx.beginPath();
        ctx.fillStyle = active ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.04)';
        ctx.arc(cp.x, cp.y, cp.r + 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = cp.color;
        ctx.shadowBlur = glow;
        ctx.shadowColor = cp.color;
        ctx.arc(cp.x, cp.y, cp.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.arc(cp.x, cp.y, cp.r * 0.32, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
      });
    }

    function drawTrail() {
      for (const p of player.trail) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(111,231,255,${0.08 + p.life * 0.4})`;
        ctx.arc(p.x, p.y, 8 + p.life * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCar(x, y, angle, color, radius = 18) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.fillRect(-radius, -radius * 0.6, radius * 2, radius * 1.2);

      ctx.fillStyle = '#ffd166';
      ctx.fillRect(-radius * 0.5, -radius * 0.35, radius, radius * 0.7);

      ctx.fillStyle = '#90f7ff';
      ctx.fillRect(radius * 0.8, -radius * 0.25, radius * 0.7, radius * 0.5);

      ctx.fillStyle = '#101827';
      ctx.fillRect(-radius * 0.9, -radius * 1.1, radius * 0.42, radius * 0.3);
      ctx.fillRect(radius * 0.5, -radius * 1.1, radius * 0.42, radius * 0.3);
      ctx.fillRect(-radius * 0.9, radius * 0.8, radius * 0.42, radius * 0.3);
      ctx.fillRect(radius * 0.5, radius * 0.8, radius * 0.42, radius * 0.3);

      ctx.restore();
    }

    function drawAi() {
      aiCars.forEach(car => drawCar(car.x, car.y, car.angle, car.color, car.radius || 18));
    }

    function drawHealthBar() {
      const barWidth = 220;
      const x = canvas.width - 255;
      const y = 28;
      ctx.fillStyle = 'rgba(7,15,24,0.72)';
      ctx.fillRect(x, y, barWidth, 18);
      ctx.fillStyle = '#ff5ec7';
      ctx.fillRect(x, y, barWidth * (player.health / 100), 18);
      ctx.strokeStyle = 'rgba(255,255,255,0.24)';
      ctx.strokeRect(x, y, barWidth, 18);
      ctx.fillStyle = '#ebf5ff';
      ctx.font = '700 12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Car Health', x + barWidth / 2, y - 8);
    }

    function render() {
      drawBackground();
      drawTrack();
      drawBoostPads();
      drawCheckpoints();
      drawTrail();
      drawAi();
      drawCar(player.x, player.y, player.angle, '#ff5ec7', player.radius);
      drawHealthBar();
      ctx.save();
      ctx.font = '700 19px Arial';
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.textAlign = 'center';
      ctx.fillText('WASD / Arrows to drift', canvas.width / 2, 34);
      ctx.restore();
    }

    function loop(ts) {
      const dt = Math.min(0.032, (ts - state.lastTime || 16) / 1000);
      state.lastTime = ts;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    bindTouch();
    window.addEventListener('keydown', (e) => onKeyChange(e, true));
    window.addEventListener('keyup', (e) => onKeyChange(e, false));
    resetRace();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
